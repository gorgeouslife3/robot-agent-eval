name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python scripts/bootstrap_sources.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experiments/supervision-efficiency/implementation -p 'test_*.py' -v
